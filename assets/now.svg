<svg xmlns="http://www.w3.org/2000/svg" width="920" height="216" viewBox="0 0 920 216" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="2" y="2" width="916" height="212" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <g>
    <circle cx="48" cy="44" r="7" fill="#3fb950">
      <animate attributeName="r" values="7;9;7" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.55;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="68" y="51" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="2">RIGHT NOW</text>
  </g>

  <g font-size="15.5" fill="#c9d1d9">
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.25s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="26 0;0 0" dur="0.45s" begin="0.25s" fill="freeze"/>
      <text x="48" y="94">🎓  Studying <tspan fill="#ffffff" font-weight="600">BS Artificial Intelligence</tspan> — Superior University, Lahore</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.55s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="26 0;0 0" dur="0.45s" begin="0.55s" fill="freeze"/>
      <text x="48" y="128">🌱  Currently learning: <tspan fill="#ffffff" font-weight="600">OOP · Applied AI · Prompt Engineering</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.85s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="26 0;0 0" dur="0.45s" begin="0.85s" fill="freeze"/>
      <text x="48" y="162">🔭  Building: <tspan fill="#ffffff" font-weight="600">CutFlow Studio</tspan> — a Premiere-level browser video editor</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.45s" begin="1.15s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="26 0;0 0" dur="0.45s" begin="1.15s" fill="freeze"/>
      <text x="48" y="196">🎯  2026 goal: <tspan fill="#ffffff" font-weight="600">CGPA 3.50+</tspan> and more open-source projects</text>
    </g>
  </g>
</svg>
