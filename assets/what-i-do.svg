<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="916" height="356" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- Title -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0s" fill="freeze"/>
    <text x="460" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">What I Do</text>
    <rect x="410" y="60" width="100" height="3" rx="1.5" fill="url(#hdr)"/>
  </g>

  <!-- ============ COLUMN 1 ============ -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 24;0 0" dur="0.5s" begin="0.3s" fill="freeze"/>
    <rect x="24" y="84" width="272" height="252" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="44" y="122" font-size="18" font-weight="700" fill="#ffffff">🎓 AI &amp; Programming</text>
  </g>
  <g font-size="15" fill="#c9d1d9">
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.7s" fill="freeze"/>
      <circle cx="52" cy="156" r="4" fill="#8b5cf6"><animate attributeName="r" values="4;5.5;4" dur="2s" begin="0.7s" repeatCount="indefinite"/></circle>
      <text x="68" y="161">Python</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.95s" fill="freeze"/>
      <circle cx="52" cy="204" r="4" fill="#8b5cf6"><animate attributeName="r" values="4;5.5;4" dur="2s" begin="0.95s" repeatCount="indefinite"/></circle>
      <text x="68" y="209">OOP</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.2s" fill="freeze"/>
      <circle cx="52" cy="252" r="4" fill="#8b5cf6"><animate attributeName="r" values="4;5.5;4" dur="2s" begin="1.2s" repeatCount="indefinite"/></circle>
      <text x="68" y="257">Applied AI</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.45s" fill="freeze"/>
      <circle cx="52" cy="300" r="4" fill="#8b5cf6"><animate attributeName="r" values="4;5.5;4" dur="2s" begin="1.45s" repeatCount="indefinite"/></circle>
      <text x="68" y="305">Prompt Engineering</text></g>
  </g>

  <!-- ============ COLUMN 2 ============ -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.55s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 24;0 0" dur="0.5s" begin="0.55s" fill="freeze"/>
    <rect x="324" y="84" width="272" height="252" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="344" y="122" font-size="18" font-weight="700" fill="#ffffff">🎬 Video &amp; Content</text>
  </g>
  <g font-size="15" fill="#c9d1d9">
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.95s" fill="freeze"/>
      <circle cx="352" cy="156" r="4" fill="#3b82f6"><animate attributeName="r" values="4;5.5;4" dur="2s" begin="0.95s" repeatCount="indefinite"/></circle>
      <text x="368" y="161">Video Editing</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.2s" fill="freeze"/>
      <circle cx="352" cy="204" r="4" fill="#3b82f6"><animate attributeName="r" values="4;5.5;4" dur="2s" begin="1.2s" repeatCount="indefinite"/></circle>
      <text x="368" y="209">Video Ads (Brands)</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.45s" fill="freeze"/>
      <circle cx="352" cy="252" r="4" fill="#3b82f6"><animate attributeName="r" values="4;5.5;4" dur="2s" begin="1.45s" repeatCount="indefinite"/></circle>
      <text x="368" y="257">AI Video Generation</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.7s" fill="freeze"/>
      <circle cx="352" cy="300" r="4" fill="#3b82f6"><animate attributeName="r" values="4;5.5;4" dur="2s" begin="1.7s" repeatCount="indefinite"/></circle>
      <text x="368" y="305">Content Creation</text></g>
  </g>

  <!-- ============ COLUMN 3 ============ -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.8s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 24;0 0" dur="0.5s" begin="0.8s" fill="freeze"/>
    <rect x="624" y="84" width="272" height="252" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="644" y="122" font-size="18" font-weight="700" fill="#ffffff">💼 Productivity</text>
  </g>
  <g font-size="15" fill="#c9d1d9">
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.2s" fill="freeze"/>
      <circle cx="652" cy="156" r="4" fill="#2B579A"><animate attributeName="r" values="4;5.5;4" dur="2s" begin="1.2s" repeatCount="indefinite"/></circle>
      <text x="668" y="161">MS Word</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.45s" fill="freeze"/>
      <circle cx="652" cy="204" r="4" fill="#217346"><animate attributeName="r" values="4;5.5;4" dur="2s" begin="1.45s" repeatCount="indefinite"/></circle>
      <text x="668" y="209">MS Excel</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.7s" fill="freeze"/>
      <circle cx="652" cy="252" r="4" fill="#B7472A"><animate attributeName="r" values="4;5.5;4" dur="2s" begin="1.7s" repeatCount="indefinite"/></circle>
      <text x="668" y="257">MS PowerPoint</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.95s" fill="freeze"/>
      <circle cx="652" cy="300" r="4" fill="#8b5cf6"><animate attributeName="r" values="4;5.5;4" dur="2s" begin="1.95s" repeatCount="indefinite"/></circle>
      <text x="668" y="305">MS Office Suite</text></g>
  </g>
</svg>
